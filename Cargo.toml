[package]
name = "aside"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4.6.9", features = ["derive"] }
dirs = "7.0.0"
futures-util = "0.3.34"
flate2 = "1"
getrandom = "0.4.3"
hex = "0.4.3"
mime_guess = "2.0.5"
open = "5.4.5"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
rusqlite = { version = "0.43.0", features = ["bundled"] }
rust-embed = "8.14.0"
serde = { version = "1.0.229", features = ["derive"] }
self-replace = "1"
semver = "1"
serde_json = "1.0.154"
sha2 = "0.11.1"
tar = "0.4"
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["full"] }
tokio-stream = { version = "0.1.19", features = ["sync"] }
toml = "1.2.1"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
ts-rs = { version = "12.0.1", features = ["chrono-impl"] }
zip = { version = "2", default-features = false, features = ["deflate"] }

[dev-dependencies]
# test-util: paused clock for scheduler timeout tests.
tokio = { version = "1.54.1", features = ["full", "test-util"] }
http-body-util = "0.1.5"
tower = { version = "0.5.3", features = ["util"] }
