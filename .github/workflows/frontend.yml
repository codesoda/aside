name: Frontend tests

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'app/**'
      - '.github/workflows/frontend.yml'
      - 'scripts/check-embedded-ui.mjs'

permissions:
  contents: read

concurrency:
  group: frontend-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - run: pnpm -C app install --frozen-lockfile
      - run: pnpm -C app check
      - run: pnpm -C app test
      - run: pnpm -C app build
      - name: Verify embedded review UI
        run: |
          ASIDE_DATA_DIR="$(mktemp -d)"
          export ASIDE_DATA_DIR
          trap 'rm -rf "$ASIDE_DATA_DIR"' EXIT
          cargo build --locked --release
          node scripts/check-embedded-ui.mjs
