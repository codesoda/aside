name: Installer tests

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'install.sh'
      - 'install.ps1'
      - 'tests/install_test.py'
      - 'tests/install_windows.ps1'
      - 'tests/inspect_contract_evaluation.py'
      - '.github/workflows/installer.yml'

permissions:
  contents: read

concurrency:
  group: installer-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  installer:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Run offline installer contract tests
        run: |
          python3 tests/install_test.py
          python3 -m unittest -v tests/inspect_contract_evaluation.py

  windows-installer:
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Smoke test official Windows release install
        shell: pwsh
        run: ./tests/install_windows.ps1
