name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  validate:
    name: Validate release tag
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Match tag to package version
        shell: bash
        run: |
          version="$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["package"]["version"])')"
          test "$GITHUB_REF_NAME" = "v$version" || {
            echo "Tag $GITHUB_REF_NAME does not match Cargo.toml version v$version" >&2
            exit 1
          }

  build:
    name: Build ${{ matrix.target }}
    needs: validate
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            runner: macos-15
          - target: x86_64-pc-windows-msvc
            runner: windows-2022
          - target: aarch64-pc-windows-msvc
            runner: windows-11-arm
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - name: Build frontend for embedding
        run: |
          pnpm -C app install --frozen-lockfile
          pnpm -C app build
      - name: Build release CLI
        run: cargo build --locked --release --target ${{ matrix.target }}

      - name: Smoke embedded UI without Node
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            bin="target/${{ matrix.target }}/release/aside.exe"
          else
            bin="target/${{ matrix.target }}/release/aside"
          fi
          bash tests/embedded_asset_smoke.sh "$bin"

      - name: Package Unix binary
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p dist/package
          install -m 0755 "target/${{ matrix.target }}/release/aside" dist/package/aside
          tar -C dist/package -czf "dist/aside-${{ github.ref_name }}-${{ matrix.target }}.tar.gz" aside

      - name: Package Windows binary
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist/package | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/aside.exe" dist/package/aside.exe
          Compress-Archive -Path dist/package/aside.exe -DestinationPath "dist/aside-${{ github.ref_name }}-${{ matrix.target }}.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: dist/aside-${{ github.ref_name }}-${{ matrix.target }}.*
          if-no-files-found: error

  publish:
    name: Publish release
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: release-*
          merge-multiple: true
      - name: Generate checksums
        shell: bash
        run: |
          cd dist
          sha256sum aside-*.tar.gz aside-*.zip > checksums-sha256.txt
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/aside-*.tar.gz
            dist/aside-*.zip
            dist/checksums-sha256.txt
          fail_on_unmatched_files: true
