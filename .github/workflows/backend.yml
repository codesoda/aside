name: Backend tests

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'src/**'
      - 'skills/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'build.rs'
      - '.cargo/**'
      - '.github/workflows/backend.yml'
      - 'app/**'
      - 'tests/embedded_asset_smoke.sh'

permissions:
  contents: read

concurrency:
  group: backend-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo test --locked
      - run: cargo clippy --locked --all-targets -- -D warnings

  embedded-ui:
    name: Embedded UI smoke
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: embedded-ui
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - name: Build frontend and release binary
        run: |
          pnpm -C app install --frozen-lockfile
          pnpm -C app build
          cargo build --locked --release
      - name: Serve embedded UI without Node
        run: bash tests/embedded_asset_smoke.sh target/release/aside
